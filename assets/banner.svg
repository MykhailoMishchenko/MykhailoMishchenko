<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mykhailo Mishchenko, Senior Frontend Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A44"/>
      <stop offset="1" stop-color="#264653"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#2A9D8F" opacity="0.18"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#FAF3E8}
      .role{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#F4A261;letter-spacing:3px}
      .line{font:400 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9FD8D0}
      .hdr{font:600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9FD8D0;letter-spacing:1.5px}
      .cell{fill:#2A9D8F;opacity:.28}
      .live{fill:#F4A261;opacity:0;animation:flash 6s ease-in-out infinite}
      .r2{animation-delay:1.2s}.r3{animation-delay:2.4s}.r4{animation-delay:3.6s}.r5{animation-delay:4.8s}
      @keyframes flash{0%,100%{opacity:0}6%{opacity:.95}22%{opacity:.95}34%{opacity:0}}
      .cursor{fill:#F4A261;animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect x="0" y="0" width="6" height="300" fill="#F4A261"/>

    <text x="64" y="112" class="name">Mykhailo Mishchenko</text>
    <text x="66" y="146" class="role">SENIOR FRONTEND ENGINEER</text>
    <text x="66" y="196" class="line">$ real-time UIs that stay fast</text>
    <text x="66" y="220" class="line">$ big rewrites, calm releases</text>
    <text x="66" y="244" class="line">$ agents do the busywork<tspan class="cursor"> &#9608;</tspan></text>

    <!-- live data grid -->
    <g transform="translate(700,58)">
      <rect width="440" height="190" rx="12" fill="#1B3A44" stroke="#2A9D8F" stroke-opacity=".45"/>
      <rect width="440" height="30" rx="12" fill="#2A9D8F" opacity=".22"/>
      <text x="18" y="20" class="hdr">ORDER</text>
      <text x="150" y="20" class="hdr">CLIENT</text>
      <text x="262" y="20" class="hdr">QTY</text>
      <text x="350" y="20" class="hdr">STATUS</text>
      <g transform="translate(14,42)">
        <rect class="live" x="-6" y="-5" width="424" height="26" rx="6"/>
        <rect class="cell" width="110" height="14" rx="4"/><rect class="cell" x="136" width="88" height="14" rx="4"/><rect class="cell" x="248" width="66" height="14" rx="4"/><rect class="cell" x="336" width="70" height="14" rx="7"/>
      </g>
      <g transform="translate(14,72)">
        <rect class="live r2" x="-6" y="-5" width="424" height="26" rx="6"/>
        <rect class="cell" width="96" height="14" rx="4"/><rect class="cell" x="136" width="100" height="14" rx="4"/><rect class="cell" x="248" width="66" height="14" rx="4"/><rect class="cell" x="336" width="70" height="14" rx="7"/>
      </g>
      <g transform="translate(14,102)">
        <rect class="live r3" x="-6" y="-5" width="424" height="26" rx="6"/>
        <rect class="cell" width="120" height="14" rx="4"/><rect class="cell" x="136" width="76" height="14" rx="4"/><rect class="cell" x="248" width="66" height="14" rx="4"/><rect class="cell" x="336" width="70" height="14" rx="7"/>
      </g>
      <g transform="translate(14,132)">
        <rect class="live r4" x="-6" y="-5" width="424" height="26" rx="6"/>
        <rect class="cell" width="88" height="14" rx="4"/><rect class="cell" x="136" width="94" height="14" rx="4"/><rect class="cell" x="248" width="66" height="14" rx="4"/><rect class="cell" x="336" width="70" height="14" rx="7"/>
      </g>
      <g transform="translate(14,162)">
        <rect class="live r5" x="-6" y="-5" width="424" height="26" rx="6"/>
        <rect class="cell" width="104" height="14" rx="4"/><rect class="cell" x="136" width="82" height="14" rx="4"/><rect class="cell" x="248" width="66" height="14" rx="4"/><rect class="cell" x="336" width="70" height="14" rx="7"/>
      </g>
    </g>
  </g>
</svg>
